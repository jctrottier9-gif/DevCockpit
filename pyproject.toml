[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devcockpit"
version = "0.1.0"
description = "Deterministic local orchestration cockpit for software-delivery workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "pydantic-settings==2.14.1",
  "SQLAlchemy==2.0.50",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
